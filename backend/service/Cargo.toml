[package]
name = "bandwidth-limiter-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[dependencies]
bandwidth-limiter-control = { path = "../control" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Security", "Win32_Security_Authorization", "Win32_System_EventLog", "Win32_System_Rpc", "Win32_System_Services", "Win32_System_IO", "Win32_Storage_FileSystem"] }

[build-dependencies]
winresource = "=0.1.34"
