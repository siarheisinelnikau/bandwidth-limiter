name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - name: Resolve locked dependencies
        run: cargo fetch --locked
      - name: Format, lint and fixture tests
        shell: pwsh
        run: ./scripts/check.ps1 -Loopback
      - name: Build standalone executable and checksum
        shell: pwsh
        run: ./scripts/package.ps1 -Offline
      - name: Render finite headless application previews
        shell: pwsh
        run: ./scripts/render-preview.ps1 -OutputDirectory (Join-Path (Get-Location) 'dist/preview')
      - name: Resolve experimental service dependencies
        run: cargo fetch --locked --manifest-path backend/service/Cargo.toml
      - name: Check and build experimental user-mode broker only
        shell: pwsh
        run: |
          ./scripts/check-wfp.ps1
          ./scripts/build-wfp.ps1 -Offline
      - name: Resolve WinDivert packet service dependencies
        run: cargo fetch --locked --manifest-path backend/packet-service/Cargo.toml
      - name: Check and build WinDivert user-mode components without loading runtime
        shell: pwsh
        run: |
          ./scripts/check-windivert.ps1
          ./scripts/build-windivert.ps1 -Offline
      - uses: actions/upload-artifact@v4
        with:
          name: BandwidthLimiter-windows-x64
          path: dist/*
